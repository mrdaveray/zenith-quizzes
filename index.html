<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kotter's 8-Step Change Model Quiz | We Are Zenith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== We Are Zenith brand palette (from the 2026 PowerPoint template) ===== */
  :root {
    --navy: #152A37;
    --lime: #E1FB5D;
    --teal: #074A5D;
    --offwhite: #EFEEEA;
    --white: #FFFFFF;
    --text: #152A37;
    --muted: #4c5d68;
    --line: #d9dcd6;
    --correct: #1f8a50;
    --correct-bg: #e6f5ec;
    --wrong: #c43d3d;
    --wrong-bg: #fbeaea;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Poppins", "Segoe UI", system-ui, Arial, sans-serif;
    font-weight: 300;
    background: var(--offwhite);
    color: var(--text);
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  strong, b { font-weight: 500; }
  header {
    background: var(--navy);
    color: var(--white);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  header img { height: 52px; width: auto; display: block; }
  .header-tag {
    font-size: .8rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
    color: var(--navy); background: var(--lime);
    padding: 6px 12px; border-radius: 999px;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 780px;
    margin: 36px auto;
    padding: 0 16px;
  }
  .card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: 0 8px 28px rgba(21, 42, 55, .08);
    padding: 36px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; right: 0; height: 6px; background: var(--lime);
  }
  h1 { margin: 0 0 10px; font-size: 1.9rem; font-weight: 700; color: var(--navy); line-height: 1.2; }
  h2 { margin: 0 0 22px; font-size: 1.25rem; font-weight: 500; color: var(--navy); }
  p.lead { color: var(--muted); margin-top: 0; }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; margin: 22px 0; }
  .pill {
    background: var(--offwhite); color: var(--navy);
    padding: 6px 14px; border-radius: 999px; font-size: .85rem; font-weight: 500;
  }
  label { display: block; font-weight: 500; margin: 16px 0 6px; }
  input[type=text] {
    width: 100%; padding: 12px 14px; font-size: 1rem; font-family: inherit;
    border: 2px solid var(--line); border-radius: 10px; color: var(--navy);
  }
  input[type=text]:focus { outline: none; border-color: var(--teal); }
  .btn {
    appearance: none; border: none; cursor: pointer; font-family: inherit;
    background: var(--navy); color: var(--white);
    padding: 13px 28px; font-size: 1rem; font-weight: 500;
    border-radius: 999px; transition: background .15s, color .15s, transform .05s;
  }
  .btn:hover { background: var(--lime); color: var(--navy); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { background: #c9ccc6; color: #fff; cursor: not-allowed; }
  .btn.secondary { background: transparent; color: var(--navy); border: 2px solid var(--navy); }
  .btn.secondary:hover { background: var(--navy); color: var(--white); }
  .btn-row { display: flex; gap: 12px; justify-content: space-between; align-items: center; margin-top: 26px; flex-wrap: wrap; }

  .progress-wrap { margin-bottom: 24px; }
  .progress-text { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .progress { height: 10px; background: var(--offwhite); border-radius: 99px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--teal); width: 0; transition: width .3s; border-radius: 99px; }

  .options { display: grid; gap: 10px; }
  .option {
    text-align: left; width: 100%; font-family: inherit; font-weight: 300;
    background: var(--white); border: 2px solid var(--line); border-radius: 12px;
    padding: 14px 16px; font-size: 1rem; cursor: pointer; color: var(--text);
    display: flex; gap: 12px; align-items: flex-start;
    transition: border-color .15s, background .15s;
  }
  .option:hover:not(:disabled) { border-color: var(--navy); background: #fbfbf8; }
  .option:hover:not(:disabled) .letter { background: var(--lime); }
  .option .letter {
    flex: 0 0 30px; height: 30px; border-radius: 50%;
    background: var(--offwhite); color: var(--navy);
    display: grid; place-items: center; font-weight: 700; font-size: .9rem;
    transition: background .15s;
  }
  .option.correct { border-color: var(--correct); background: var(--correct-bg); }
  .option.correct .letter { background: var(--correct); color: #fff; }
  .option.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .option.wrong .letter { background: var(--wrong); color: #fff; }
  .option:disabled { cursor: default; }

  .hint-btn { background: none; border: none; color: var(--teal); font-weight: 500; cursor: pointer; padding: 0; font-size: .95rem; font-family: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .hint { margin-top: 10px; padding: 12px 14px; background: #f7fde0; border-left: 4px solid var(--lime); border-radius: 8px; font-size: .95rem; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: .97rem; }
  .feedback.good { background: var(--correct-bg); border-left: 4px solid var(--correct); }
  .feedback.bad { background: var(--wrong-bg); border-left: 4px solid var(--wrong); }

  .score-ring {
    width: 160px; height: 160px; border-radius: 50%;
    margin: 12px auto 20px;
    display: grid; place-items: center;
    background: conic-gradient(var(--navy) calc(var(--pct) * 1%), var(--offwhite) 0);
  }
  .score-ring > div {
    width: 124px; height: 124px; border-radius: 50%; background: var(--lime);
    display: grid; place-items: center; font-size: 2rem; font-weight: 700; color: var(--navy);
  }
  .center { text-align: center; }
  .review { margin-top: 28px; display: grid; gap: 10px; }
  .review-item { padding: 12px 14px; border-radius: 10px; background: var(--offwhite); font-size: .95rem; }
  .review-item.ok { border-left: 4px solid var(--correct); }
  .review-item.no { border-left: 4px solid var(--wrong); }
  .review-item small { color: var(--muted); display: block; margin-top: 4px; }
  .send-status { margin: 22px auto 0; max-width: 520px; padding: 12px 16px; border-radius: 10px; font-size: .92rem; background: var(--offwhite); }
  .send-status.ok { background: var(--correct-bg); border-left: 4px solid var(--correct); text-align: left; }
  .send-status.fail { background: var(--wrong-bg); border-left: 4px solid var(--wrong); text-align: left; }
  .send-status a { color: var(--teal); font-weight: 500; }
  .field-error { color: var(--wrong); font-size: .85rem; margin-top: 6px; }
  .hidden { display: none; }
  footer { background: var(--navy); color: rgba(255,255,255,.75); text-align: center; font-size: .8rem; padding: 18px; }
  footer .star { color: var(--lime); font-weight: 700; }

  @media (max-width: 560px) {
    .card { padding: 24px; }
    h1 { font-size: 1.5rem; }
    header { padding: 14px 18px; }
    header img { height: 40px; }
    .header-tag { display: none; }
  }
  @media print {
    body { background: #fff; }
    header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .btn-row, footer { display: none; }
    .card { box-shadow: none; }
  }
</style>
</head>

<main>
  <!-- Start screen -->
  <section id="start" class="card">
    <h1 id="quizTitle"></h1>
    <p class="lead" id="quizIntro"></p>
    <div class="meta" id="quizMeta"></div>
    <label for="learnerName">Your full name</label>
    <input type="text" id="learnerName" placeholder="e.g. Alex Smith" autocomplete="name" required>
    <div class="field-error hidden" id="nameError">Please enter your name so your trainer receives your results.</div>
    <p class="lead" style="font-size:.85rem;margin-top:10px">When you finish, your name and results are emailed to your trainer.</p>
    <div class="btn-row">
      <span></span>
      <button class="btn" id="startBtn">Start quiz</button>
    </div>
  </section>

  <!-- Question screen -->
  <section id="quiz" class="card hidden" aria-live="polite">
    <div class="progress-wrap">
      <div class="progress-text"><span id="qCount"></span><span id="qScore"></span></div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
    <h2 id="qText"></h2>
    <div class="options" id="options"></div>
    <div style="margin-top:14px">
      <button class="hint-btn" id="hintBtn">Show a hint</button>
      <div class="hint hidden" id="hintBox"></div>
    </div>
    <div id="feedback" class="feedback hidden"></div>
    <div class="btn-row">
      <span></span>
      <button class="btn" id="nextBtn" disabled>Next question</button>
    </div>
  </section>

  <!-- Results screen -->
  <section id="results" class="card hidden center">
    <h1 id="resultHeading">Quiz complete</h1>
    <div class="score-ring" id="scoreRing"><div id="scorePct">0%</div></div>
    <p class="lead" id="resultMsg"></p>
    <div class="send-status" id="sendStatus">Sending your results to your trainer...</div>
    <div class="review" id="review" style="text-align:left"></div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn secondary" id="printBtn">Print / save as PDF</button>
      <button class="btn" id="retryBtn">Try again</button>
    </div>
  </section>
</main>

<script>
/* ===== Quiz content: edit this block to make a new quiz ===== */
const QUIZ = {
  title: "Kotter's 8-Step Change Model",
  intro: "Test your understanding of John Kotter's 8-Step Change Model, based on the video \"Kotter's 8-Step Change Model Explained\".",
  passMark: 70, // percent
  // Results are emailed here via FormSubmit (https://formsubmit.co).
  // The first submission sends an activation email to this address: click the link in it once.
  resultsEmail: "dave@we-are-zenith.com",
  shuffleOptions: true,
  questions: [
    {
      q: "What is the first step in Kotter's 8-Step Change Model?",
      options: ["Create a vision", "Create urgency", "Build a coalition", "Create quick wins"],
      answer: 1,
      hint: "People need a reason to move before anything else happens.",
      explain: "The model starts by creating urgency, helping people see why change is needed now. Without it, complacency stalls the rest of the process."
    },
    {
      q: "In the 'Build a coalition' step, who should the coalition include?",
      options: ["Only senior executives", "External consultants only", "Influential people from across the organisation, with a mix of skills, authority and credibility", "Whoever volunteers first"],
      answer: 2,
      hint: "Think influence, not just job title.",
      explain: "A guiding coalition works best when it brings together people with influence, expertise and credibility from different levels and areas, not just the top team."
    },
    {
      q: "Which step comes immediately after 'Create a vision'?",
      options: ["Empower others", "Embed the change", "Communicate the vision", "Build on the change"],
      answer: 2,
      hint: "A vision nobody hears about can't change anything.",
      explain: "Once the vision exists, it has to be communicated clearly and often so people understand it and buy in. That is step 4."
    },
    {
      q: "What is the main purpose of the 'Empower others' step?",
      options: ["Promoting the coalition members", "Removing obstacles so people can act on the vision", "Writing the vision statement", "Celebrating early successes"],
      answer: 1,
      hint: "What stops people acting on a change even when they agree with it?",
      explain: "Empowering others means removing barriers such as outdated processes, structures or resistant individuals, so people are able to act on the vision."
    },
    {
      q: "Why are quick wins important in Kotter's model?",
      options: ["They replace the need for a long-term vision", "They let the project finish early", "They build momentum and show the change is working, which helps win over doubters", "They reduce the need for communication"],
      answer: 2,
      hint: "Think about motivation and the sceptics.",
      explain: "Visible short-term wins prove the change is worthwhile, keep people motivated and weaken the arguments of critics."
    },
    {
      q: "What risk does the 'Build on the change' step guard against?",
      options: ["Declaring victory too early", "Spending too long on urgency", "Having too large a coalition", "Communicating the vision too often"],
      answer: 0,
      hint: "Early wins can make people relax.",
      explain: "Kotter warns that many changes fail because success is declared too soon. Building on the change means using early wins as a platform to keep improving."
    },
    {
      q: "What does the final step, 'Embed the change', aim to achieve?",
      options: ["A one-off training session", "Making the change part of the organisation's culture so it sticks", "Starting the next change project", "Disbanding the coalition"],
      answer: 1,
      hint: "Think about what happens after the change leaders move on.",
      explain: "Embedding the change anchors it in the culture, values and everyday ways of working so it lasts beyond the people who led it."
    },
    {
      q: "Which of these is a commonly cited disadvantage of Kotter's model?",
      options: ["It has no clear structure", "It ignores the need for communication", "It is fairly top-down and linear, so skipping steps can cause problems and it can be slow", "It only works in small businesses"],
      answer: 2,
      hint: "Think about how rigid an 8-step sequence is.",
      explain: "Critics say the model is top-down, with limited input from staff, and that its step-by-step sequence can be time-consuming and inflexible. Its strengths are its clear structure and focus on buy-in."
    }
  ]
};
/* ===== End of quiz content ===== */

const $ = id => document.getElementById(id);
const LETTERS = "ABCDEFGH";
let order = [], idx = 0, score = 0, answers = [], learner = "", attempt = 0;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function init() {
  $("quizTitle").textContent = QUIZ.title;
  $("quizIntro").textContent = QUIZ.intro;
  $("year").textContent = new Date().getFullYear();
  document.title = QUIZ.title + " Quiz | We Are Zenith";
  $("quizMeta").innerHTML =
    `<span class="pill">${QUIZ.questions.length} questions</span>` +
    `<span class="pill">Pass mark ${QUIZ.passMark}%</span>` +
    `<span class="pill">Hints available</span>`;
}

function start() {
  learner = $("learnerName").value.trim();
  if (!learner) {
    $("nameError").classList.remove("hidden");
    $("learnerName").focus();
    return;
  }
  $("nameError").classList.add("hidden");
  attempt++;
  idx = 0; score = 0; answers = [];
  order = QUIZ.questions.map(q => {
    const opts = q.options.map((text, i) => ({ text, correct: i === q.answer }));
    return { ...q, opts: QUIZ.shuffleOptions ? shuffle(opts) : opts };
  });
  show("quiz");
  renderQuestion();
}

function show(id) {
  ["start", "quiz", "results"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderQuestion() {
  const q = order[idx];
  const total = order.length;
  $("qCount").textContent = `Question ${idx + 1} of ${total}`;
  $("qScore").textContent = `Score: ${score}`;
  $("progressBar").style.width = `${(idx / total) * 100}%`;
  $("qText").textContent = q.q;
  $("feedback").className = "feedback hidden";
  $("hintBox").classList.add("hidden");
  $("hintBox").textContent = q.hint || "";
  $("hintBtn").classList.toggle("hidden", !q.hint);
  $("hintBtn").textContent = "Show a hint";
  $("nextBtn").disabled = true;
  $("nextBtn").textContent = idx === total - 1 ? "See results" : "Next question";

  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = `<span class="letter">${LETTERS[i]}</span><span></span>`;
    b.lastChild.textContent = o.text;
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });
}

function choose(i) {
  const q = order[idx];
  const buttons = [...$("options").children];
  const correctIdx = q.opts.findIndex(o => o.correct);
  const right = i === correctIdx;
  buttons.forEach((b, j) => {
    b.disabled = true;
    if (j === correctIdx) b.classList.add("correct");
    else if (j === i) b.classList.add("wrong");
  });
  if (right) score++;
  answers.push({ q: q.q, chosen: q.opts[i].text, correct: q.opts[correctIdx].text, right });
  const fb = $("feedback");
  fb.className = "feedback " + (right ? "good" : "bad");
  fb.innerHTML = `<strong>${right ? "Correct!" : "Not quite."}</strong> `;
  fb.appendChild(document.createTextNode(q.explain));
  $("qScore").textContent = `Score: ${score}`;
  $("nextBtn").disabled = false;
  $("nextBtn").focus();
}

function next() {
  idx++;
  if (idx < order.length) renderQuestion();
  else results();
}

function results() {
  const total = order.length;
  const pct = Math.round((score / total) * 100);
  const passed = pct >= QUIZ.passMark;
  $("progressBar").style.width = "100%";
  $("scoreRing").style.setProperty("--pct", pct);
  $("scorePct").textContent = pct + "%";
  const who = learner ? `, ${learner}` : "";
  $("resultHeading").textContent = passed ? `Well done${who}!` : `Keep going${who}`;
  $("resultMsg").textContent =
    `You scored ${score} out of ${total}. ` +
    (passed ? "That's a pass. Great work!" : `The pass mark is ${QUIZ.passMark}%. Review the answers below and have another go.`);

  const rev = $("review");
  rev.innerHTML = "<h2 style='margin-bottom:6px'>Your answers</h2>";
  answers.forEach((a, n) => {
    const d = document.createElement("div");
    d.className = "review-item " + (a.right ? "ok" : "no");
    const title = document.createElement("strong");
    title.textContent = `${n + 1}. ${a.q}`;
    const sm = document.createElement("small");
    sm.textContent = a.right ? `Your answer: ${a.chosen} ✓` : `Your answer: ${a.chosen} ✗  |  Correct: ${a.correct}`;
    d.append(title, sm);
    rev.appendChild(d);
  });
  show("results");
  sendResults(pct, passed);
}

function buildSummary(pct, passed) {
  const lines = answers.map((a, n) =>
    `${n + 1}. ${a.q}\n   Answer: ${a.chosen} (${a.right ? "correct" : "incorrect"})` +
    (a.right ? "" : `\n   Correct answer: ${a.correct}`));
  return `Learner: ${learner}\nQuiz: ${QUIZ.title}\nScore: ${score}/${answers.length} (${pct}%)\n` +
    `Result: ${passed ? "PASS" : "NOT YET PASSED"} (pass mark ${QUIZ.passMark}%)\nAttempt: ${attempt}\n` +
    `Completed: ${new Date().toLocaleString("en-GB")}\n\n${lines.join("\n\n")}`;
}

async function sendResults(pct, passed) {
  const box = $("sendStatus");
  box.className = "send-status";
  box.textContent = "Sending your results to your trainer...";
  const subject = `Quiz result: ${learner} scored ${pct}% on ${QUIZ.title}`;
  const summary = buildSummary(pct, passed);
  const payload = {
    _subject: subject,
    _template: "box",
    _captcha: "false",
    Learner: learner,
    Quiz: QUIZ.title,
    Score: `${score}/${answers.length} (${pct}%)`,
    Result: passed ? "PASS" : "NOT YET PASSED",
    Attempt: String(attempt),
    Completed: new Date().toLocaleString("en-GB"),
    Answers: summary.split("\n\n").slice(1).join("\n\n")
  };
  try {
    const res = await fetch(`https://formsubmit.co/ajax/${QUIZ.resultsEmail}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || String(data.success) !== "true") throw new Error(data.message || "Send failed");
    box.className = "send-status ok";
    box.textContent = "✓ Your results have been sent to your trainer.";
  } catch (err) {
    const mailto = `mailto:${QUIZ.resultsEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(summary)}`;
    box.className = "send-status fail";
    box.innerHTML = 'We couldn\'t send your results automatically. <a id="mailtoLink">Click here to email them instead</a>, then press Send.';
    $("mailtoLink").href = mailto;
  }
}

$("startBtn").addEventListener("click", start);
$("learnerName").addEventListener("keydown", e => { if (e.key === "Enter") start(); });
$("nextBtn").addEventListener("click", next);
$("retryBtn").addEventListener("click", () => show("start"));
$("printBtn").addEventListener("click", () => window.print());
$("hintBtn").addEventListener("click", () => {
  const h = $("hintBox");
  h.classList.toggle("hidden");
  $("hintBtn").textContent = h.classList.contains("hidden") ? "Show a hint" : "Hide hint";
});
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hidden")) return;
  const k = e.key.toUpperCase();
  const i = LETTERS.indexOf(k);
  const btns = [...$("options").children];
  if (i >= 0 && i < btns.length && !btns[i].disabled) btns[i].click();
  if (e.key === "Enter" && !$("nextBtn").disabled && document.activeElement !== $("nextBtn")) next();
});

init();
</script>
</body>
</html>
